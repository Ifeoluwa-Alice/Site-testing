[project]
name = "cyberdev-soc-demo"
version = "1.0.0"
description = "A local-first security operations dashboard for event triage and incident response."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
